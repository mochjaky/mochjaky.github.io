<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css?v=2.3">
    <!-- Hide body until auth check is complete -->
    <style>body { visibility: hidden; }</style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h2><i class='bx bx-shield-quarter'></i> Admin Dashboard</h2>
            <div>
                <span id="admin-email" style="margin-right: 1rem; color: var(--text-color-light);"></span>
                <button onclick="seedDefaultData()" class="btn btn--small btn--outline" style="margin-right: 0.5rem;"><i class='bx bx-cloud-upload'></i> Import Sample Data</button>
                <button id="btn-logout" class="btn btn--small btn--outline">Logout</button>
                <a href="index.html" class="btn btn--small">View Site</a>
            </div>
        </div>

        <div class="admin-tabs">
            <button class="admin-tab-btn active" data-target="projects-section">Projects</button>
            <button class="admin-tab-btn" data-target="experience-section">Experience</button>
            <button class="admin-tab-btn" data-target="profile-section">Profile & Hero</button>
        </div>

        <!-- ================= PROJECTS SECTION ================= -->
        <div class="admin-section active" id="projects-section">
            <div class="admin-grid">
                <!-- Form -->
                <div class="admin-form-container">
                    <h3 style="margin-bottom: 1.5rem;" id="project-form-title">Add New Project</h3>
                    <form id="project-form">
                        <input type="hidden" id="project-id">
                        
                        <div class="form-group">
                            <label class="form-label">Project Title</label>
                            <input type="text" id="project-title" class="form-input" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Category</label>
                            <select id="project-category" class="form-select" required>
                                <option value="web">Web Development</option>
                                <option value="design">UI/UX Design</option>
                                <option value="system">System / Application</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Description</label>
                            <textarea id="project-desc" class="form-textarea" rows="4" required></textarea>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Technologies (comma separated)</label>
                            <input type="text" id="project-tech" class="form-input" placeholder="React, Node.js, Firebase" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Project Image</label>
                            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                                <input type="file" id="project-img-file" class="form-input" accept="image/*">
                                <div style="text-align: center; font-size: 0.75rem; color: var(--text-color-light);">— ATAU TEMPEL URL GAMBAR —</div>
                                <input type="text" id="project-img" class="form-input" placeholder="https://... atau data gambar">
                                <div id="project-img-preview-container" style="display: none; margin-top: 0.5rem; text-align: center;">
                                    <img id="project-img-preview" src="" style="max-width: 100%; max-height: 140px; border-radius: 0.5rem; border: 1px solid var(--glass-border); object-fit: cover;">
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Project Link</label>
                            <input type="url" id="project-link" class="form-input" placeholder="https://github.com/..." required>
                        </div>

                        <button type="submit" class="btn" style="width: 100%;" id="btn-project-submit">Save Project</button>
                        <button type="button" class="btn btn--outline" style="width: 100%; margin-top: 0.5rem; display: none;" id="btn-project-cancel">Cancel Edit</button>
                    </form>
                </div>

                <!-- Table -->
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="project-list">
                            <tr><td colspan="4" style="text-align: center;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ================= EXPERIENCE SECTION ================= -->
        <div class="admin-section" id="experience-section">
            <div class="admin-grid">
                <!-- Form -->
                <div class="admin-form-container">
                    <h3 style="margin-bottom: 1.5rem;" id="exp-form-title">Add Experience</h3>
                    <form id="exp-form">
                        <input type="hidden" id="exp-id">
                        
                        <div class="form-group">
                            <label class="form-label">Company / Organization</label>
                            <input type="text" id="exp-company" class="form-input" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Role / Position</label>
                            <input type="text" id="exp-role" class="form-input" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Date (e.g., 2021 - Present)</label>
                            <input type="text" id="exp-date" class="form-input" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Description</label>
                            <textarea id="exp-desc" class="form-textarea" rows="4" required></textarea>
                        </div>

                        <button type="submit" class="btn" style="width: 100%;" id="btn-exp-submit">Save Experience</button>
                        <button type="button" class="btn btn--outline" style="width: 100%; margin-top: 0.5rem; display: none;" id="btn-exp-cancel">Cancel Edit</button>
                    </form>
                </div>

                <!-- Table -->
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Role</th>
                                <th>Company</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="exp-list">
                            <tr><td colspan="4" style="text-align: center;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ================= PROFILE SECTION ================= -->
        <div class="admin-section" id="profile-section">
            <div class="admin-grid" style="grid-template-columns: 1fr;">
                <div class="admin-form-container" style="max-width: 600px; margin: 0 auto; width: 100%;">
                    <h3 style="margin-bottom: 1.5rem;">Edit Profile & Hero Section</h3>
                    <form id="profile-form">
                        
                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="prof-name" class="form-input" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Roles (comma separated, e.g., IT Consultant, Web Developer)</label>
                            <input type="text" id="prof-roles" class="form-input" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Short Description</label>
                            <textarea id="prof-desc" class="form-textarea" rows="4" required></textarea>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Profile Image</label>
                            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                                <input type="file" id="prof-img-file" class="form-input" accept="image/*">
                                <div style="text-align: center; font-size: 0.75rem; color: var(--text-color-light);">— ATAU TEMPEL URL GAMBAR —</div>
                                <input type="text" id="prof-img" class="form-input" placeholder="https://... atau data gambar">
                                <div id="prof-img-preview-container" style="display: none; margin-top: 0.5rem; text-align: center;">
                                    <img id="prof-img-preview" src="" style="width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--first-color); object-fit: cover;">
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Years of Experience</label>
                            <input type="text" id="prof-years" class="form-input" required>
                        </div>

                        <button type="submit" class="btn" style="width: 100%;" id="btn-prof-submit">Save Profile</button>
                        <p id="prof-msg" style="color: var(--first-color); margin-top: 1rem; display: none; text-align: center;">Profile updated successfully!</p>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase SDK & Admin Logic -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/admin.js?v=2.4"></script>
</body>
</html>
