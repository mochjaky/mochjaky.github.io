<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: var(--glass-color);
            padding: 3rem 2rem;
            border-radius: 1.5rem;
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="favicon.svg" alt="Logo" style="width: 52px; height: 52px; border-radius: 12px; margin-bottom: 1rem; box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);">
        <h2 style="margin-bottom: 2rem;">Admin Login</h2>
        <form id="login-form">
            <div class="form-group" style="text-align: left;">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-input" required>
            </div>
            <div class="form-group" style="text-align: left;">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-input" required>
            </div>
            
            <p id="error-msg" style="color: #ef4444; font-size: var(--small-font-size); margin-bottom: 1rem; display: none;"></p>
            
            <button type="submit" class="btn" style="width: 100%;">Login</button>
        </form>
        <a href="index.html" style="display: block; margin-top: 1.5rem; color: var(--text-color-light); font-size: var(--small-font-size);"><i class='bx bx-arrow-back'></i> Back to Site</a>
    </div>

    <!-- Firebase SDK & Login Logic -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/login.js"></script>
</body>
</html>
